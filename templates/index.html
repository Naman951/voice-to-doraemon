<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice to Doraemon 🎙️➡️🤖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .doraemon-icon {
            font-size: 3em;
            margin: 10px 0;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .upload-box {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-box:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-box.dragging {
            background: #e8ecff;
            border-color: #764ba2;
        }

        .upload-box input {
            display: none;
        }

        .upload-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .upload-subtext {
            color: #999;
            font-size: 0.9em;
        }

        .file-info {
            margin-top: 15px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            color: #2e7d32;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .controls {
            margin-bottom: 30px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .control-value {
            color: #667eea;
            font-weight: 700;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            background: #764ba2;
            transform: scale(1.2);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .slider::-moz-range-thumb:hover {
            background: #764ba2;
            transform: scale(1.2);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-convert {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-convert:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-convert:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .output-section {
            margin-top: 30px;
            text-align: center;
        }

        .output-audio {
            width: 100%;
            margin: 15px 0;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
            font-weight: 600;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-message.error {
            background: #ffebee;
            color: #c62828;
        }

        .status-message.info {
            background: #e3f2fd;
            color: #1565c0;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="doraemon-icon">🎙️➡️🤖</div>
            <h1>Voice to Doraemon</h1>
            <p>Transform your voice into Doraemon!</p>
        </div>

        <div class="upload-section">
            <div class="upload-box" id="uploadBox">
                <input type="file" id="audioFile" accept="audio/*">
                <div class="upload-icon">📁</div>
                <div class="upload-text">Click to upload or drag and drop</div>
                <div class="upload-subtext">Supports: WAV, MP3, OGG, M4A (Max 50MB)</div>
            </div>
            <div class="file-info" id="fileInfo">
                <strong>File:</strong> <span id="fileName"></span><br>
                <strong>Duration:</strong> <span id="fileDuration"></span>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="control-label">
                    <span>Pitch Shift</span>
                    <span class="control-value"><span id="pitchValue">2.5</span> semitones</span>
                </div>
                <input type="range" id="pitchSlider" class="slider" min="-12" max="12" step="0.5" value="2.5">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>Speed</span>
                    <span class="control-value"><span id="speedValue">1.0</span>x</span>
                </div>
                <input type="range" id="speedSlider" class="slider" min="0.5" max="2" step="0.1" value="1.0">
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-convert" id="convertBtn">Convert 🎵</button>
            <button class="btn btn-reset" id="resetBtn">Reset</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Processing your audio...</div>
        </div>

        <div class="status-message" id="statusMessage"></div>

        <div class="output-section" id="outputSection">
            <h3>Output Audio</h3>
            <audio id="outputAudio" class="output-audio" controls></audio>
            <button class="btn btn-convert" id="downloadBtn" style="display: none;">Download 📥</button>
        </div>

        <div class="footer">
            <p>Made with ❤️ for Doraemon fans</p>
            <p><a href="https://github.com/Naman951/voice-to-doraemon" target="_blank">View on GitHub</a></p>
        </div>
    </div>

    <script>
        const uploadBox = document.getElementById('uploadBox');
        const audioFile = document.getElementById('audioFile');
        const fileInfo = document.getElementById('fileInfo');
        const convertBtn = document.getElementById('convertBtn');
        const resetBtn = document.getElementById('resetBtn');
        const pitchSlider = document.getElementById('pitchSlider');
        const speedSlider = document.getElementById('speedSlider');
        const pitchValue = document.getElementById('pitchValue');
        const speedValue = document.getElementById('speedValue');
        const loading = document.getElementById('loading');
        const statusMessage = document.getElementById('statusMessage');
        const outputSection = document.getElementById('outputSection');
        const outputAudio = document.getElementById('outputAudio');
        const downloadBtn = document.getElementById('downloadBtn');

        let selectedFile = null;

        // Upload box events
        uploadBox.addEventListener('click', () => audioFile.click());

        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.classList.add('dragging');
        });

        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragging');
        });

        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragging');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        audioFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            selectedFile = file;
            document.getElementById('fileName').textContent = file.name;

            const audio = new Audio(URL.createObjectURL(file));
            audio.onloadedmetadata = () => {
                const duration = audio.duration;
                const minutes = Math.floor(duration / 60);
                const seconds = Math.floor(duration % 60);
                document.getElementById('fileDuration').textContent = 
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
            };

            fileInfo.classList.add('show');
            convertBtn.disabled = false;
        }

        // Slider events
        pitchSlider.addEventListener('input', (e) => {
            pitchValue.textContent = e.target.value;
        });

        speedSlider.addEventListener('input', (e) => {
            speedValue.textContent = e.target.value;
        });

        // Convert button
        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) {
                showStatus('Please select an audio file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('audio', selectedFile);
            formData.append('pitch', pitchSlider.value);
            formData.append('speed', speedSlider.value);

            loading.classList.add('show');
            convertBtn.disabled = true;
            statusMessage.classList.remove('show');

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Conversion failed');
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                outputAudio.src = url;
                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `doraemon_${selectedFile.name}`;
                    a.click();
                };
                downloadBtn.style.display = 'block';

                showStatus('✅ Conversion successful! 🎉', 'success');
                outputSection.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                showStatus(`❌ ${error.message}`, 'error');
            } finally {
                loading.classList.remove('show');
                convertBtn.disabled = false;
            }
        });

        // Reset button
        resetBtn.addEventListener('click', () => {
            selectedFile = null;
            audioFile.value = '';
            fileInfo.classList.remove('show');
            pitchSlider.value = 2.5;
            speedSlider.value = 1.0;
            pitchValue.textContent = '2.5';
            speedValue.textContent = '1.0';
            convertBtn.disabled = true;
            outputAudio.src = '';
            downloadBtn.style.display = 'none';
            statusMessage.classList.remove('show');
            outputSection.scrollIntoView({ behavior: 'smooth' });
        });

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message show ${type}`;
        }

        convertBtn.disabled = true;
    </script>
</body>
</html>
